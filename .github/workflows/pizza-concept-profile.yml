name: Pizza concept projection profile

on:
  push:
    paths:
      - "src/ontology/pizza-edit.owl"
      - "projections/common/**"
      - "projections/pizza-concepts/**"
      - ".github/workflows/pizza-concept-profile.yml"
  pull_request:
    paths:
      - "src/ontology/pizza-edit.owl"
      - "projections/common/**"
      - "projections/pizza-concepts/**"
      - ".github/workflows/pizza-concept-profile.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-projection-profile:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install projection dependencies
        run: python -m pip install -r projections/pizza-concepts/requirements.txt

      - name: Install projection-profile dependencies
        run: python -m pip install -r projections/pizza-concepts/profile/requirements.txt

      - name: Verify projection/preservation profile
        run: python projections/pizza-concepts/profile/verify_profile.py
