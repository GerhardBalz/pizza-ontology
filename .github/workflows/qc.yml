# Pizza ontology CI

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  ontology_qc:
    runs-on: ubuntu-latest
    container: obolibrary/odkfull:v1.6.1

    steps:
      - uses: actions/checkout@v4

      - name: Run ontology QC checks
        env:
          DEFAULT_BRANCH: main
        run: cd src/ontology && make ROBOT_ENV='ROBOT_JAVA_ARGS=-Xmx6G' test IMP=false PAT=false MIR=false

      - name: Build and verify preservation-safe distributions
        run: cd src/ontology && make preservation_release_artifact

  oak_access:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OAK
        run: python -m pip install -r examples/oak/requirements.txt

      - name: Run OAK Pizza access slice
        run: bash examples/oak/run.sh

  reasoning_artifact:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Run canonical Pizza reasoning artifact
        run: bash artifacts/reasoning/run.sh

  rule_evaluation:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install rule evaluator dependency
        run: python -m pip install -r artifacts/rules/requirements.txt

      - name: Evaluate canonical Pizza rule artifact
        run: python artifacts/rules/evaluate_rule.py

  decision_evaluation:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Evaluate canonical Pizza DMN decision artifact
        run: python artifacts/decisions/evaluate_decision.py

  calculation_evaluation:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Evaluate canonical Pizza OpenMath calculation artifact
        run: python artifacts/calculations/evaluate_calculation.py

  mapping_evaluation:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install mapping evaluator dependency
        run: python -m pip install -r artifacts/mappings/requirements.txt

      - name: Evaluate canonical Pizza semantic mapping artifact
        run: python artifacts/mappings/evaluate_mapping.py

  workflow_evaluation:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install workflow evaluator dependencies
        run: python -m pip install -r artifacts/workflows/requirements.txt

      - name: Execute canonical Pizza BPMN workflow artifact
        run: python artifacts/workflows/evaluate_workflow.py

  shacl_validation:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SHACL validator
        run: python -m pip install -r artifacts/validation/requirements.txt

      - name: Validate canonical Pizza instance examples
        run: python artifacts/validation/validate_examples.py

      - name: Verify semantic artifact consumer contract
        run: python artifacts/verify_consumer_contract.py

      - name: Verify publication metadata contract
        run: python metadata/verify_publication_metadata.py
